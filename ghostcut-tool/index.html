<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고스트컷 자동 생성</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --panel2:#1c1f28; --line:#282c38;
    --text:#eef0f5; --muted:#8b91a3; --accent:#ff5a3c; --accent2:#3ddc97;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; line-height:1.55;
  }

  header{
    display:flex; align-items:center; gap:14px;
    padding:18px 26px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  .logo{
    width:32px;height:32px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;
  }
  header h1{font-size:16px;font-weight:700;letter-spacing:-.2px;}
  header .sub{font-size:12px;color:var(--muted);}
  .mode{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--muted);
    border:1px solid var(--line); padding:6px 12px; border-radius:999px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);}
  .dot.live{background:var(--accent);}

  .wrap{display:grid; grid-template-columns:330px 1fr; gap:0; align-items:start;}
  @media (max-width:900px){ .wrap{grid-template-columns:1fr;} }

  aside{
    padding:22px; border-right:1px solid var(--line); background:var(--panel);
    min-height:calc(100vh - 69px); position:sticky; top:69px;
  }
  @media (max-width:900px){ aside{position:static;min-height:0;border-right:none;border-bottom:1px solid var(--line);} }

  .label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin-bottom:9px;text-transform:uppercase;}

  .drop{
    border:1.5px dashed var(--line); border-radius:var(--radius); padding:26px 16px;
    text-align:center; cursor:pointer; transition:.15s; background:var(--panel2);
  }
  .drop:hover,.drop.over{border-color:var(--accent); background:#20232d;}
  .drop svg{opacity:.5;margin-bottom:8px;}
  .drop b{display:block;font-size:13px;margin-bottom:3px;}
  .drop span{font-size:11.5px;color:var(--muted);}

  .field{margin-top:22px;}
  select,input[type=text]{
    width:100%; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    font-size:13px; font-family:inherit; outline:none;
  }
  select:focus,input:focus{border-color:var(--accent);}

  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    border:1px solid var(--line); background:var(--panel2); color:var(--muted);
    padding:7px 13px; border-radius:999px; font-size:12.5px; cursor:pointer; transition:.12s;
    font-family:inherit;
  }
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}

  .run{
    width:100%; margin-top:26px; padding:13px; border:none; border-radius:11px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit; transition:.15s;
  }
  .run:hover{filter:brightness(1.08);}
  .run:disabled{background:#3a3d48;color:#6e7484;cursor:not-allowed;}
  .hint{font-size:11px;color:var(--muted);margin-top:10px;text-align:center;}

  main{padding:22px 26px 60px;}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .bar h2{font-size:15px;font-weight:700;}
  .count{font-size:12px;color:var(--muted);}
  .dl{
    margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--text);
    padding:8px 15px; border-radius:9px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .dl:hover{border-color:var(--accent);}
  .dl:disabled{opacity:.4;cursor:not-allowed;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .shot{
    position:relative; aspect-ratio:3/4; background:
      linear-gradient(45deg,#1a1c23 25%,transparent 25%,transparent 75%,#1a1c23 75%),
      linear-gradient(45deg,#1a1c23 25%,#141620 25%,#141620 75%,#1a1c23 75%);
    background-size:16px 16px; background-position:0 0,8px 8px;
    display:grid;place-items:center;
  }
  .shot img{width:100%;height:100%;object-fit:contain;display:block;}
  .badge{
    position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:700;
    padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px);
  }
  .b-wait{background:rgba(139,145,163,.22);color:#b9bfd0;}
  .b-run{background:rgba(255,90,60,.22);color:#ff9b85;}
  .b-done{background:rgba(61,220,151,.18);color:var(--accent2);}
  .b-err{background:rgba(255,80,80,.2);color:#ff8b8b;}

  .toggle{
    position:absolute;bottom:9px;left:9px;display:flex;gap:0;
    border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  }
  .toggle button{
    background:rgba(10,11,15,.72);color:#c9cede;border:none;padding:5px 11px;
    font-size:10.5px;cursor:pointer;font-family:inherit;backdrop-filter:blur(6px);
  }
  .toggle button.on{background:var(--accent);color:#fff;font-weight:700;}

  .meta{padding:11px 13px;display:flex;align-items:center;gap:9px;}
  .meta .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .meta .save{
    margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);
    width:29px;height:29px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none;
  }
  .meta .save:hover{border-color:var(--accent);color:var(--text);}
  .meta .save:disabled{opacity:.3;cursor:not-allowed;}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:70px 20px;
    text-align:center;color:var(--muted);
  }
  .empty b{display:block;color:var(--text);font-size:14px;margin-bottom:5px;font-weight:600;}
  .empty span{font-size:12.5px;}

  .spin{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.13);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .errtxt{font-size:11.5px;color:#ff8b8b;padding:0 13px 11px;}
</style>
</head>
<body>

<header>
  <div class="logo">G</div>
  <div>
    <h1>고스트컷 자동 생성</h1>
    <div class="sub">모델 착장 이미지 → 상품 단독 누끼 PNG</div>
  </div>
  <div class="mode"><span class="dot" id="dot"></span><span id="modeTxt">데모 모드</span></div>
</header>

<div class="wrap">
  <aside>
    <div class="label">이미지 업로드</div>
    <div class="drop" id="drop">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
      </svg>
      <b>클릭 또는 드래그</b>
      <span>여러 장을 한 번에 넣을 수 있습니다</span>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>

    <div class="field">
      <div class="label">추출할 아이템</div>
      <div class="chips" id="items"></div>
    </div>

    <div class="field">
      <div class="label">배경</div>
      <div class="chips" id="bgs"></div>
    </div>

    <button class="run" id="run" disabled>생성하기</button>
    <div class="hint" id="hint">이미지를 넣어주세요</div>
  </aside>

  <main>
    <div class="bar">
      <h2>결과</h2>
      <span class="count" id="cnt"></span>
      <button class="dl" id="dlAll" disabled>완료된 결과 저장</button>
    </div>
    <div id="out">
      <div class="empty">
        <b>아직 결과가 없습니다</b>
        <span>왼쪽에서 착장 이미지를 넣고 생성하기를 누르세요</span>
      </div>
    </div>
  </main>
</div>

<script>
// ============================================================
// 설정 — 라이브 모드로 바꾸려면 LIVE 를 true 로
// server.py 가 켜져 있어야 하고, 그 안에 Comfy 연결이 설정되어 있어야 합니다.
// ============================================================
const LIVE = false;
const API  = "http://127.0.0.1:8787";

const ITEMS = [
  {id:"top",     ko:"상의",   en:"top"},
  {id:"pants",   ko:"하의",   en:"pants"},
  {id:"skirt",   ko:"스커트", en:"skirt"},
  {id:"dress",   ko:"원피스", en:"dress"},
  {id:"jacket",  ko:"자켓",   en:"jacket"},
];
const BGS = [
  {id:"alpha", ko:"투명"},
  {id:"white", ko:"흰색"},
];

let item = "top", bg = "alpha", jobs = [], busy = false;

// --- 옵션 칩 만들기 -----------------------------------------
function chips(el, list, cur, pick){
  el.innerHTML = "";
  list.forEach(o=>{
    const b = document.createElement("button");
    b.className = "chip" + (o.id===cur ? " on" : "");
    b.textContent = o.ko;
    b.onclick = ()=>{ pick(o.id); };
    el.appendChild(b);
  });
}
function drawOpts(){
  chips(document.getElementById("items"), ITEMS, item, v=>{item=v; drawOpts();});
  chips(document.getElementById("bgs"),   BGS,   bg,   v=>{bg=v;   drawOpts();});
}
drawOpts();

// --- 파일 받기 -----------------------------------------------
const drop = document.getElementById("drop"), file = document.getElementById("file");
drop.onclick = ()=>file.click();
file.onchange = e=>add([...e.target.files]);
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop", e=>add([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"))));

function add(files){
  if(!files.length) return;
  files.forEach(f=>{
    jobs.push({ id:crypto.randomUUID(), name:f.name, file:f,
                src:URL.createObjectURL(f), out:null, state:"wait", view:"after", err:null });
  });
  render(); sync();
}

// --- 실행 ----------------------------------------------------
document.getElementById("run").onclick = async ()=>{
  const queue = jobs.filter(j=>j.state==="wait" || j.state==="error");
  if(!queue.length || busy) return;
  busy = true; sync();

  // 한 장씩 순서대로 처리합니다. 한 장이 실패해도 나머지는 계속 진행합니다.
  for(const j of queue){
    j.state = "run"; j.err = null; render();
    try{
      j.out = LIVE ? await runLive(j) : await runDemo(j);
      j.state = "done";
    }catch(err){
      j.state = "error"; j.err = err.message || String(err);
    }
    render();
  }
  busy = false; sync();
};

// 데모 모드: 미리 준비한 결과를 순서대로 보여줍니다. 네트워크를 쓰지 않습니다.
const DEMO = ["assets/demo_01.png","assets/demo_02.png","assets/demo_03.png","assets/demo_04.png"];
let demoIdx = 0;
function runDemo(j){
  return new Promise((ok,fail)=>{
    setTimeout(()=>{
      const url = DEMO[demoIdx++ % DEMO.length];
      const img = new Image();
      img.onload  = ()=>ok(url);
      img.onerror = ()=>fail(new Error("데모 이미지가 없습니다: " + url));
      img.src = url;
    }, 900 + Math.random()*700);
  });
}

// 라이브 모드: 로컬 서버에 이미지를 올리고 결과를 받습니다.
async function runLive(j){
  const fd = new FormData();
  fd.append("image", j.file);
  fd.append("item",  ITEMS.find(i=>i.id===item).en);
  fd.append("background", bg);
  const res = await fetch(API + "/generate", { method:"POST", body:fd });
  if(!res.ok) throw new Error("서버 오류 " + res.status + " — server.py 가 켜져 있는지 확인하세요");
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.url;
}

// --- 화면 그리기 ---------------------------------------------
function render(){
  const out = document.getElementById("out");
  if(!jobs.length){
    out.innerHTML = '<div class="empty"><b>아직 결과가 없습니다</b><span>왼쪽에서 착장 이미지를 넣고 생성하기를 누르세요</span></div>';
    return;
  }
  const g = document.createElement("div");
  g.className = "grid";
  jobs.forEach(j=>g.appendChild(card(j)));
  out.innerHTML = ""; out.appendChild(g);
}

function card(j){
  const el = document.createElement("div");
  el.className = "card";

  const badge = {wait:["b-wait","대기"],run:["b-run","생성중"],done:["b-done","완료"],error:["b-err","실패"]}[j.state];
  const showAfter = j.state==="done" && j.view==="after";
  const img = showAfter ? j.out : j.src;

  el.innerHTML = `
    <div class="shot">
      ${ j.state==="run" ? '<div class="spin"></div>' : `<img src="${img}" alt="">` }
      <div class="badge ${badge[0]}">${badge[1]}</div>
      ${ j.state==="done" ? `
        <div class="toggle">
          <button data-v="before" class="${j.view==="before"?"on":""}">원본</button>
          <button data-v="after"  class="${j.view==="after" ?"on":""}">결과</button>
        </div>` : "" }
    </div>
    <div class="meta">
      <span class="nm" title="${j.name}">${j.name}</span>
      <button class="save" ${j.state==="done"?"":"disabled"} title="PNG 저장">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
      </button>
    </div>
    ${ j.err ? `<div class="errtxt">${j.err}</div>` : "" }
  `;

  el.querySelectorAll(".toggle button").forEach(b=>{
    b.onclick = ()=>{ j.view = b.dataset.v; render(); };
  });
  const sv = el.querySelector(".save");
  if(j.state==="done") sv.onclick = ()=>save(j);
  return el;
}

function sync(){
  const wait = jobs.filter(j=>j.state==="wait"||j.state==="error").length;
  const done = jobs.filter(j=>j.state==="done").length;
  document.getElementById("run").disabled = busy || !wait;
  document.getElementById("run").textContent = busy ? "생성 중…" : "생성하기";
  document.getElementById("dlAll").disabled = !done;
  document.getElementById("cnt").textContent = jobs.length ? `${done} / ${jobs.length} 완료` : "";
  document.getElementById("hint").textContent =
    busy ? "처리 중입니다" : wait ? `${wait}장 대기 중` : jobs.length ? "모두 처리했습니다" : "이미지를 넣어주세요";
  document.getElementById("dot").className = "dot" + (LIVE ? " live" : "");
  document.getElementById("modeTxt").textContent = LIVE ? "라이브 모드" : "데모 모드";
}
sync();

// --- 저장 ----------------------------------------------------
async function save(j){
  const base = j.name.replace(/\.[^.]+$/, "");
  const a = document.createElement("a");
  a.href = j.out;
  a.download = `${base}_${item}_ghostcut.png`;
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById("dlAll").onclick = async ()=>{
  for(const j of jobs.filter(x=>x.state==="done")){
    save(j);
    await new Promise(r=>setTimeout(r,320)); // 브라우저가 연속 다운로드를 막지 않도록 간격을 둡니다
  }
};
</script>
</body>
</html>
