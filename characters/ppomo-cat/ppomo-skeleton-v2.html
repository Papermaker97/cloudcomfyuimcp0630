<!doctype html>
<html lang="ko">
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
  /* Layout: full-bleed stage, character centered; one quiet control strip at the bottom. */
  :root {
    --bg-top: #FBF7F3;
    --bg-bottom: #EFE6DF;
    --fg: #3A3A3E;
    --muted: #7C808A;
    --chip: rgba(255, 255, 255, 0.72);
    --chip-line: rgba(58, 58, 62, 0.10);
    --chip-on: #3A3A3E;
    --chip-on-fg: #F7F5F0;
    --font-display: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #2A2D34; --bg-bottom: #1B1D22; --fg: #ECEDF0; --muted: #9A9EA8;
      --chip: rgba(40, 42, 49, 0.72); --chip-line: rgba(236, 237, 240, 0.12);
      --chip-on: #ECEDF0; --chip-on-fg: #24262C; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #2A2D34; --bg-bottom: #1B1D22; --fg: #ECEDF0; --muted: #9A9EA8;
    --chip: rgba(40, 42, 49, 0.72); --chip-line: rgba(236, 237, 240, 0.12);
    --chip-on: #ECEDF0; --chip-on-fg: #24262C; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--fg); font-family: var(--font-ui);
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  header {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px;
    display: flex; align-items: baseline; gap: 10px; pointer-events: none;
  }
  header h1 { margin: 0; font: 400 1.35rem/1.2 var(--font-display); letter-spacing: 0.01em; }
  header span { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
    max-width: calc(100% - 32px); padding: 6px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--chip-line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .controls button {
    font: 500 0.8rem/1 var(--font-ui); color: var(--fg); background: transparent;
    border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .controls button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
  .controls button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--chip-line); }
  .sep { width: 1px; height: 18px; background: var(--chip-line); }
  #sheet-labels { position: fixed; inset: 0; pointer-events: none; display: none; }
  .clarity { display: inline-flex; align-items: center; gap: 8px; font: 500 0.8rem/1 var(--font-ui); color: var(--fg); padding: 0 6px; }
  .clarity input { width: 110px; accent-color: #E8829A; }
  .count { font: 600 0.85rem/1 var(--font-ui); color: var(--muted); min-width: 2ch; padding-right: 8px; text-align: right; }
  .legend { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 56px); left: 16px; display: grid; gap: 6px;
    font: 500 0.78rem/1.3 var(--font-ui); color: var(--fg); background: var(--chip); border: 1px solid var(--chip-line);
    border-radius: 12px; padding: 10px 12px; max-width: min(300px, calc(100% - 32px)); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
  #sheet-labels div { position: absolute; font: 600 13px/1 var(--font-ui); color: var(--muted); letter-spacing: 0.06em; }
</style>

<div id="stage"></div>
<header>
  <h1>뽀모 · 스켈레톤 v2</h1>

</div>

  <div><i style="background:#C8323C"></i>One wire pair along the spine</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- shape table (measured off the turnaround sketch: 1 unit ≈ 200 px of the sheet) ----------
// y up from the floor, z = forward (face). Head in front, a bigger body behind that rises toward the back,
// two butt lobes at the rear, small cheek pouches at the lower sides of the face (they puff later).
const SHAPE = {
  head:  { x: 0, y: 0.40, z: 0.52, rx: 0.65, ry: 0.40, rz: 0.46 },   // 머리: 몸통만큼 넓고 더 낮음
  torso: { x: 0, y: 0.48, z: -0.25, rx: 0.72, ry: 0.48, rz: 0.66 },  // 몸통
  rump:  { x: 0, y: 0.55, z: -0.45, r: 0.43 },                       // 등 뒤쪽이 더 높게 올라가는 볼륨
  cheek: { x: 0.36, y: 0.30, z: 0.78, r: 0.21 },                     // 볼주머니 ±x (얼굴 아래 양옆)
  ear:   { x: 0.31, y: 0.80, z: 0.52, rx: 0.155, ry: 0.155, rz: 0.08, tilt: 0.18 },  // 둥근 귀: 동그란 윤곽, 앞뒤로만 납작 ±x
  eye:   { x: 0.24, y: 0.42, r: 0.040 },                             // 점 눈 ±x (z = 얼굴 표면)
  mouth: { y: 0.39 },
  belly: { x: 0, y: 0.18, z: -0.10, rx: 0.66, ry: 0.20, rz: 0.85 }, // 배: 아래쪽 납작한 타원체
  paw:   { x: 0.50, y: 0.09, z: 0.70, r: 0.11 },                     // 앞발 ±x
  foot:  { x: 0.52, y: 0.09, z: -0.86, r: 0.11 },                    // 뒷발 ±x
  butt:  { x: 0.27, y: 0.42, z: -0.76, r: 0.36 },                    // 엉덩이 두 볼 ±x
};
const PAL = {
  body: '#F5BFCB',      // strawberry-milk pink
  cheek: '#EE98AA',     // blush on the cheek pouches
  belly: '#FBF0DA',     // cream underside
  butt: '#EFAAB8',      // slightly deeper pink on the butt
  ink: '#4A2E24',       // dark brown eyes and mouth
};
const GROUND_Y = 0;

// ---------- metaball-style field ----------
// Every part is its own element (like a Blender metaball element) with its own scale.
// The surface is the smooth union of all of them, so seams melt together.
const SCALE = { cheekL: 1, cheekR: 1, belly: 1, butt: 1 };   // 빵빵폼: change these, then rebuild()
const BLEND = { body: 0.12, rump: 0.30, cheek: 0.10, ear: 0.06, leg: 0.07, belly: 0.14, butt: 0.12, floor: 0.10 };
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const smax = (a, b, k) => -smin(-a, -b, k);
const ell = (x, y, z, cx, cy, cz, rx, ry, rz) =>
  (Math.hypot((x - cx) / rx, (y - cy) / ry, (z - cz) / rz) - 1) * Math.min(rx, ry, rz);
const sph = (x, y, z, cx, cy, cz, r) => Math.hypot(x - cx, y - cy, z - cz) - r;

// ear: a round, front-to-back flattened disc, tilted a little outward
function earSDF(x, y, z, side) {
  const E = SHAPE.ear, c = Math.cos(side * E.tilt), s = Math.sin(side * E.tilt);
  const ex = x - E.x * side, ey = y - E.y, ez = z - E.z;
  const lx = ex * c + ey * s, ly = -ex * s + ey * c;
  return (Math.hypot(lx / E.rx, ly / E.ry, ez / E.rz) - 1) * E.rz * 0.9;   // round outline, flat front-to-back
}
function modelSDF(x, y, z) {
  const H = SHAPE.head, T = SHAPE.torso, Rm = SHAPE.rump, C = SHAPE.cheek, E = SHAPE.ear;
  const P = SHAPE.paw, F = SHAPE.foot, B = SHAPE.butt, Be = SHAPE.belly;
  let d = smin(
    ell(x, y, z, H.x, H.y, H.z, H.rx, H.ry, H.rz),
    smin(ell(x, y, z, T.x, T.y, T.z, T.rx, T.ry, T.rz), sph(x, y, z, Rm.x, Rm.y, Rm.z, Rm.r), BLEND.rump),
    BLEND.body);
  const bs = SCALE.belly;
  d = smin(d, ell(x, y, z, Be.x, Be.y, Be.z, Be.rx * bs, Be.ry * bs, Be.rz * bs), BLEND.belly);
  d = smin(d, sph(x, y, z, -C.x, C.y, C.z, C.r * SCALE.cheekL), BLEND.cheek);
  d = smin(d, sph(x, y, z, C.x, C.y, C.z, C.r * SCALE.cheekR), BLEND.cheek);
  for (const sx of [-1, 1]) {
    d = smin(d, earSDF(x, y, z, sx), BLEND.ear);
    d = smin(d, sph(x, y, z, P.x * sx, P.y, P.z, P.r), BLEND.leg);
    d = smin(d, sph(x, y, z, F.x * sx, F.y, F.z, F.r), BLEND.leg);
    d = smin(d, sph(x, y, z, B.x * sx, B.y, B.z, B.r * SCALE.butt), BLEND.butt);
  }
  return smax(d, -(y - 0.035), BLEND.floor);                 // 바닥은 납작하게
}

// ---------- surface extraction (naive surface nets + projection onto the field) ----------
function meshField(f, min, max, h) {
  const nx = Math.ceil((max[0] - min[0]) / h), ny = Math.ceil((max[1] - min[1]) / h), nz = Math.ceil((max[2] - min[2]) / h);
  const sx = nx + 1, sxy = (nx + 1) * (ny + 1);
  const val = new Float32Array(sxy * (nz + 1));
  for (let k = 0; k <= nz; k++) for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++)
    val[i + sx * j + sxy * k] = f(min[0] + i * h, min[1] + j * h, min[2] + k * h);

  const cellV = new Int32Array(nx * ny * nz).fill(-1);
  const cellIdx = (i, j, k) => i + nx * (j + ny * k);
  const pos = [];
  const EDGES = [];
  for (let a = 0; a < 8; a++) for (const bit of [1, 2, 4]) if (!(a & bit)) EDGES.push([a, a | bit]);
  const cv = new Float32Array(8);
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let mask = 0;
    for (let c = 0; c < 8; c++) {
      const v = val[(i + (c & 1)) + sx * (j + ((c >> 1) & 1)) + sxy * (k + ((c >> 2) & 1))];
      cv[c] = v; if (v < 0) mask |= 1 << c;
    }
    if (mask === 0 || mask === 255) continue;
    let px = 0, py = 0, pz = 0, n = 0;
    for (const [a, b] of EDGES) {
      if ((cv[a] < 0) === (cv[b] < 0)) continue;
      const t = cv[a] / (cv[a] - cv[b]);
      px += (a & 1) + t * ((b & 1) - (a & 1));
      py += ((a >> 1) & 1) + t * (((b >> 1) & 1) - ((a >> 1) & 1));
      pz += ((a >> 2) & 1) + t * (((b >> 2) & 1) - ((a >> 2) & 1));
      n++;
    }
    cellV[cellIdx(i, j, k)] = pos.length / 3;
    pos.push(min[0] + (i + px / n) * h, min[1] + (j + py / n) * h, min[2] + (k + pz / n) * h);
  }

  const idx = [];
  const dims = [nx, ny, nz];
  for (let k = 0; k <= nz; k++) for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
    const g = [i, j, k], v0 = val[i + sx * j + sxy * k];
    for (let ax = 0; ax < 3; ax++) {
      const u = (ax + 1) % 3, w = (ax + 2) % 3;
      if (g[ax] >= dims[ax] || g[u] < 1 || g[w] < 1 || g[u] >= dims[u] || g[w] >= dims[w]) continue;
      const g2 = g.slice(); g2[ax]++;
      const v1 = val[g2[0] + sx * g2[1] + sxy * g2[2]];
      if ((v0 < 0) === (v1 < 0)) continue;
      const cell = (du, dw) => { const c = g.slice(); c[u] -= du; c[w] -= dw; return cellV[cellIdx(c[0], c[1], c[2])]; };
      const a = cell(1, 1), b = cell(0, 1), c = cell(0, 0), d = cell(1, 0);
      if (a < 0 || b < 0 || c < 0 || d < 0) continue;
      if (v0 < 0) idx.push(a, b, c, a, c, d); else idx.push(a, c, b, a, d, c);
    }
  }

  // pull each vertex onto the true surface and take normals from the field gradient
  const nrm = new Float32Array(pos.length), e = h * 0.25;
  for (let q = 0; q < pos.length; q += 3) {
    let x = pos[q], y = pos[q + 1], z = pos[q + 2], gx = 0, gy = 0, gz = 0;
    for (let it = 0; it < 3; it++) {
      const d = f(x, y, z);
      gx = f(x + e, y, z) - f(x - e, y, z); gy = f(x, y + e, z) - f(x, y - e, z); gz = f(x, y, z + e) - f(x, y, z - e);
      const gl = Math.hypot(gx, gy, gz) || 1; gx /= gl; gy /= gl; gz /= gl;
      x -= d * gx; y -= d * gy; z -= d * gz;
    }
    pos[q] = x; pos[q + 1] = y; pos[q + 2] = z;
    nrm[q] = gx; nrm[q + 1] = gy; nrm[q + 2] = gz;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setIndex(idx);
  // make winding agree with the outward normals
  const ia = idx[0] * 3, ib = idx[1] * 3, ic = idx[2] * 3;
  const A = new THREE.Vector3(pos[ia], pos[ia + 1], pos[ia + 2]), Bv = new THREE.Vector3(pos[ib], pos[ib + 1], pos[ib + 2]), Cv = new THREE.Vector3(pos[ic], pos[ic + 1], pos[ic + 2]);
  const fn = Bv.sub(A).cross(Cv.sub(A));
  if (fn.dot(new THREE.Vector3(nrm[ia], nrm[ia + 1], nrm[ia + 2])) < 0) {
    for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
    geo.setIndex(idx);
  }
  return geo;
}
const BOUNDS = { min: [-1.0, -0.02, -1.45], max: [1.0, 1.3, 1.3] };   // room for ×1.3 cheeks, ×1.25 belly/butt
// front surface z of the model at (x, y)
function bodyFrontZ(x, y) {
  let z = 3; while (z > -3 && modelSDF(x, y, z) > 0) z -= 0.004;
  return z;
}

// ---------- scene ----------
const params = new URLSearchParams(location.search);
const SHEET = params.has('sheet');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: SHEET });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.35;

scene.add(new THREE.HemisphereLight(0xffffff, 0xf3e3e0, 0.8));
const sun = new THREE.DirectionalLight(0xfffaf5, 1.05);
sun.position.set(-1.6, 5, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 14;
sun.shadow.blurSamples = 20;
sun.shadow.bias = -0.002;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 14 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.14 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = GROUND_Y;
ground.receiveShadow = true;
scene.add(ground);

// ---------- materials (matte silicone squishy) ----------
const silicone = (extra = {}) => new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.6, clearcoat: 0.2, clearcoatRoughness: 0.55,
  sheen: 0.35, sheenRoughness: 0.8, sheenColor: new THREE.Color(0xffffff), ...extra,
});
// every fur part shares one material; its colour comes from per-vertex pastel blooms (see recolor)
const furMat = new THREE.MeshPhysicalMaterial({        // translucent pink jelly: you can see the bones inside
  color: 0xffffff, vertexColors: true, roughness: 0.14, transmission: 0.93, thickness: 0.4, ior: 1.33,
  attenuationColor: new THREE.Color('#EC8CA2'), attenuationDistance: 1.8, clearcoat: 0.6, clearcoatRoughness: 0.2,
  sheen: 0.2, sheenColor: new THREE.Color(0xffffff),
});
const inkMat = new THREE.MeshPhysicalMaterial({ color: PAL.ink, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.3 });

// ---------- pastel bloom colour field ----------
// Colour is a function of position in the model's rest pose, so a pouch and the body beside it
// get the same colour where they meet: the bloom fades across the seam with no hard edge.
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const BLOOMS = [];
function addBloom(color, center, outward, r, inner = 0.55, outer = 1.55, push = 0.35) {
  const emitter = center.clone().addScaledVector(outward.clone().normalize(), r * push);
  BLOOMS.push({ color: new THREE.Color(color), emitter, r, inner, outer });
}
const BELLY_FIELD = { color: new THREE.Color(PAL.belly) };
function colorAt(p, base, out) {
  out.copy(base);
  for (const b of BLOOMS) {
    const w = 1 - smooth(b.inner * b.r, b.outer * b.r, p.distanceTo(b.emitter));
    if (w > 0) out.lerp(b.color, w);
  }
  if (BELLY_FIELD.center) {                       // soft cream underside
    const f = BELLY_FIELD;
    const d = Math.hypot((p.x - f.center.x) / f.rx, (p.y - f.center.y) / f.ry, (p.z - f.center.z) / f.rz);
    const w = 1 - smooth(0.85, 1.25, d);
    if (w > 0) out.lerp(f.color, w);
  }
  return out;
}
function colorizeGeometry(geo, baseHex) {
  const base = new THREE.Color(baseHex), c = new THREE.Color(), p = new THREE.Vector3();
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    colorAt(p.fromBufferAttribute(pos, i), base, c);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

// ---------- helpers ----------
const SPHERE_GEO = new THREE.SphereGeometry(1, 48, 32);
function ball(mat, r, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(SPHERE_GEO, mat);
  m.scale.set(r * sx, r * sy, r * sz);
  return m;
}
function part(name, x, y, z) { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); return g; }
// ---------- build ----------
const ppomo = new THREE.Group(); ppomo.name = 'ppomo';
scene.add(ppomo);

// colour blooms follow the current part scales
function setupBlooms() {
  BLOOMS.length = 0;
  const H = SHAPE.head, headC = new THREE.Vector3(H.x, H.y, H.z), C = SHAPE.cheek, B = SHAPE.butt, Be = SHAPE.belly;
  for (const [side, key] of [[-1, 'cheekL'], [1, 'cheekR']]) {
    const c = new THREE.Vector3(C.x * side, C.y, C.z);
    addBloom(PAL.cheek, c, c.clone().sub(headC).normalize().add(new THREE.Vector3(0, 0, 1.2)), C.r * SCALE[key]);
  }
  for (const side of [-1, 1])
    addBloom(PAL.butt, new THREE.Vector3(B.x * side, B.y, B.z), new THREE.Vector3(side * 0.5, -0.1, -1), B.r * SCALE.butt, 0.0, 1.0, 0.3);
  const bs = SCALE.belly;
  Object.assign(BELLY_FIELD, { center: new THREE.Vector3(Be.x, Be.y, Be.z), rx: Be.rx * bs, ry: Be.ry * bs, rz: Be.rz * bs });
}

const body = new THREE.Group(); body.name = 'body';
const bodyMesh = new THREE.Mesh(new THREE.BufferGeometry(), furMat);
bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
body.add(bodyMesh);
ppomo.add(body);
let baseColor = PAL.body;
function rebuild() {
  setupBlooms();
  const geo = meshField(modelSDF, BOUNDS.min, BOUNDS.max, 0.02);
  colorizeGeometry(geo, baseColor);
  bodyMesh.geometry.dispose();
  bodyMesh.geometry = geo;
}
function recolor(hex) { baseColor = hex; colorizeGeometry(bodyMesh.geometry, hex); }
rebuild();

// eyes (tiny dots set high between the cheeks) and mouth (tiny ω) sit on the face surface,
// so they are re-placed whenever the field changes
const face = [];
for (const side of [-1, 1]) {
  const g = new THREE.Group(); g.name = side < 0 ? 'eyeL' : 'eyeR';
  g.add(ball(inkMat, SHAPE.eye.r, 1, 1.1, 0.5));
  ppomo.add(g);
  face.push(() => {
    const x = SHAPE.eye.x * side, y = SHAPE.eye.y, z = bodyFrontZ(x, y);
    g.position.set(x, y, z - 0.008);
    g.lookAt(new THREE.Vector3(x * 3, y, z + 3));
  });
}
{
  const g = new THREE.Group(); g.name = 'mouth';
  for (const side of [-1, 1]) {
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.006, 8, 24, Math.PI), inkMat);
    arc.rotation.z = Math.PI;
    arc.position.x = side * 0.024;
    g.add(arc);
  }
  ppomo.add(g);
  face.push(() => { const y = SHAPE.mouth.y; g.position.set(0, y, bodyFrontZ(0, y) + 0.003); });
}
const placeFace = () => face.forEach((f) => f());
placeFace();

// ---------- inside: a slender, bendable skeleton that follows the body ~75% inside it ----------
// Bones are the structure: skull (holds the board), neck, spine along the back, flexible ribs,
// pelvis in the butt. The clickers (buttons) hide in the joints, and each bone is a lever:
//   * top of the back  -> the floating mid-vertebra presses a button inside the spine
//   * either side      -> the ribs bend in; their root presses a button on the side of the spine
//   * the butt         -> the pelvis wings tip in at the sacrum and press a button
// Printed in a flexible filament (TPU) the ribs and skull bend with the squish and spring back.
// web coords: y up, z forward (face).
const boneMat = new THREE.MeshStandardMaterial({ color: 0xF4EEE4, roughness: 0.55 });
const pcbMat = new THREE.MeshStandardMaterial({ color: 0x2C6E49, roughness: 0.55 });
const chipMat = new THREE.MeshStandardMaterial({ color: 0x1E1E22, roughness: 0.4 });
const btnMat = new THREE.MeshStandardMaterial({ color: 0x2A2A30, roughness: 0.4, emissive: 0xFF5A6E, emissiveIntensity: 0 });
const inside = new THREE.Group(); inside.name = 'inside';
ppomo.add(inside);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const tube = (pts, r, mat = boneMat, seg = 40) => {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, r, 10, false), mat);
  inside.add(m); return m;
};
const blob = (mat, x, y, z, sx, sy, sz) => { const m = ball(mat, 1, sx, sy, sz); m.position.set(x, y, z); inside.add(m); return m; };
// an elliptical arc as a bone: centre c, in-plane axes u, v (unit vectors), radii ru, rv, angles a0..a1
const arc = (c, u, v, ru, rv, a0, a1, r, n = 24) => {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n; pts.push(c.clone().addScaledVector(u, ru * Math.cos(t)).addScaledVector(v, rv * Math.sin(t))); }
  return tube(pts, r);
};
const X = V(1, 0, 0), Y = V(0, 1, 0), Z = V(0, 0, 1);

// skull: a light cage around the head (no eye sockets, so the face stays cute), holding the board
const SK = V(0, 0.42, 0.50);
arc(SK, X, Z, 0.40, 0.28, 0, Math.PI * 2, 0.022, 48);                    // around the head
arc(SK, Z, Y, 0.28, 0.24, -0.2, Math.PI + 0.2, 0.022, 36);              // front-to-back over the top
arc(SK, X, Y, 0.40, 0.24, -0.1, Math.PI + 0.1, 0.022, 36);              // ear-to-ear over the top
arc(V(0, 0.29, 0.55), X, Z, 0.26, 0.19, 0.15 * Math.PI, 0.85 * Math.PI, 0.02, 20);   // little jaw
const board = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.016, 0.15), pcbMat);
board.position.set(0, 0.33, 0.48); inside.add(board);
const chip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 0.06), chipMat);
chip.position.set(0, 0.343, 0.48); inside.add(chip);

// spine: neck + back, small vertebrae on a gently bent line
const spine = new THREE.CatmullRomCurve3([V(0, 0.44, 0.22), V(0, 0.58, 0.02), V(0, 0.70, -0.22), V(0, 0.68, -0.48), V(0, 0.52, -0.78)]);
const N = 16;
for (let i = 0; i <= N; i++) {
  const t = i / N, p = spine.getPointAt(t), d = spine.getTangentAt(t);
  const v = blob(boneMat, p.x, p.y, p.z, 0.055, 0.04, 0.03);
  v.lookAt(p.clone().add(d));
}
tube(spine.getPoints(30), 0.018);                                         // the cord through the vertebrae
const spineAt = (z) => { let best = 0, bd = 9; for (let i = 0; i <= 200; i++) { const q = spine.getPointAt(i / 200); if (Math.abs(q.z - z) < bd) { bd = Math.abs(q.z - z); best = i / 200; } } return spine.getPointAt(best); };

// ribs: open C-shapes hanging from the spine on each side, free at the belly so they can bend
const ribGroups = { L: new THREE.Group(), R: new THREE.Group() };
inside.add(ribGroups.L, ribGroups.R);
for (const z of [0.02, -0.14, -0.30, -0.46]) {
  const top = spineAt(z);
  const w = 0.72 * 0.64 * Math.sqrt(Math.max(0.35, 1 - ((z + 0.25) / 0.66) ** 2));
  const h = top.y - 0.24;
  for (const [side, g] of [[1, ribGroups.R], [-1, ribGroups.L]]) {
    const pts = [];
    for (let i = 0; i <= 20; i++) {
      const t = Math.PI / 2 - (i / 20) * Math.PI * 0.5;                // from the spine down the side
      pts.push(V(side * w * Math.cos(t), 0.24 + h * Math.sin(t), z));
    }
    const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 30, 0.02, 10, false), boneMat);
    g.add(m);
  }
}
// pelvis: two wings and a sacrum in the butt
const SAC = spineAt(-0.70);
blob(boneMat, 0, SAC.y - 0.06, -0.70, 0.07, 0.09, 0.06);
const wings = [];
for (const s of [-1, 1]) {
  const w = blob(boneMat, s * 0.19, 0.40, -0.72, 0.13, 0.16, 0.045);
  w.rotation.set(0.15, s * 0.5, s * -0.25); wings.push(w);
}

// clickers: 4 buttons hidden in the joints (dark), all wired in parallel to one pin
const buttons = [];
const button = (x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.035, 0.06), btnMat); b.position.set(x, y, z); inside.add(b); buttons.push(b); return b; };
const mid = spineAt(-0.22);
button(0, mid.y - 0.06, -0.22);                                           // under the floating mid-vertebra
button(-0.07, mid.y - 0.09, -0.20).rotation.z = Math.PI / 2;               // left rib root
button(0.07, mid.y - 0.09, -0.20).rotation.z = Math.PI / 2;                // right rib root
button(0, SAC.y - 0.15, -0.72);                                            // pelvis / sacrum
// wires: one thin pair along the spine from the joints to the board in the skull
tube([V(0.02, 0.36, 0.42), V(0.03, 0.47, 0.18), V(0.03, 0.60, -0.05), V(0.03, mid.y - 0.05, -0.20), V(0.03, SAC.y - 0.12, -0.70)], 0.006, new THREE.MeshStandardMaterial({ color: 0xC8323C }));

// ---------- squeeze: jelly squashes, ribs and pelvis bend in, the buttons click ----------
let squeezeT = 0, squeezes = 0;
const countEl = document.getElementById('squeeze-count');
function squeeze() { squeezeT = 1; squeezes++; countEl.textContent = squeezes; }
document.getElementById('btn-squeeze').addEventListener('click', squeeze);
renderer.domElement.addEventListener('dblclick', squeeze);
document.getElementById('clarity').addEventListener('input', (e) => { furMat.transmission = Number(e.target.value); });
function animateSqueeze() {
  squeezeT = Math.max(0, squeezeT - 0.04);
  const s = Math.sin(squeezeT * Math.PI);                       // 0 -> 1 -> 0
  ppomo.scale.set(1 + 0.05 * s, 1 - 0.09 * s, 1 + 0.03 * s);
  ribGroups.L.scale.x = ribGroups.R.scale.x = 1 - 0.12 * s;     // ribs bend in
  for (const w of wings) w.scale.z = 0.045 * (1 - 0.3 * s);
  btnMat.emissiveIntensity = 2.2 * s;
}

// per-part scale (빵빵폼): e.g. ppomo.setScale('cheekL', 1.3) — the field is re-meshed so seams stay smooth
window.ppomo = {
  setScale(name, s) { if (!(name in SCALE)) throw new Error(`unknown part ${name}`); SCALE[name] = s; rebuild(); placeFace(); },
  scales: SCALE,
};

// ---------- camera & controls ----------
const camera = new THREE.PerspectiveCamera(30, stage.clientWidth / stage.clientHeight, 0.1, 60);
const TARGET = new THREE.Vector3(0, 0.45, -0.05);
camera.position.set(4.6, 2.3, 4.6);       // 3/4 view, face to the left like the references
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = !SHEET && !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.4;
controls.update();

// ---------- UI ----------
const rotateBtn = document.getElementById('btn-rotate');
rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
rotateBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
});


function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ---------- 4-view sheet (?sheet) ----------
const VIEWS = [
  { label: 'FRONT · 정면', pos: [0, 0, 1], up: [0, 1, 0] },
  { label: 'SIDE · 측면', pos: [1, 0, 0], up: [0, 1, 0] },    // 옆모습, 얼굴이 화면 왼쪽 (스케치와 같게)
  { label: 'BACK · 후면', pos: [0, 0, -1], up: [0, 1, 0] },
  { label: 'TOP · 윗면', pos: [0, 1, 0], up: [0, 0, -1] },    // 얼굴(앞)이 화면 아래
];
function renderSheet() {
  document.querySelector('header').hidden = true;
  document.querySelector('.controls').hidden = true;
  const labels = document.getElementById('sheet-labels');
  labels.style.display = 'block';
  const W = stage.clientWidth, H = stage.clientHeight, w = W / 2, h = H / 2;
  const cam = new THREE.OrthographicCamera(-1.6, 1.6, 1.6, -1.6, 0.1, 60);
  renderer.setScissorTest(true);
  VIEWS.forEach((v, i) => {
    const x = (i % 2) * w, yTop = Math.floor(i / 2) * h;
    renderer.setViewport(x, H - yTop - h, w, h);
    renderer.setScissor(x, H - yTop - h, w, h);
    cam.position.set(...v.pos).multiplyScalar(8).add(TARGET);
    cam.up.set(...v.up);
    cam.lookAt(TARGET);
    ground.visible = i !== 3;   // top view: no floor shadow
    renderer.render(scene, cam);
    const el = document.createElement('div');
    el.textContent = v.label; el.style.left = `${x + 18}px`; el.style.top = `${yTop + 16}px`;
    labels.appendChild(el);
  });
  document.body.dataset.ready = '1';
}

if (SHEET) {
  ground.material.opacity = 0.1;
  renderSheet();
} else {
  const view = VIEWS.find((v) => v.label.toLowerCase().startsWith(params.get('view') || '~'));
  if (view) {
    camera.position.set(...view.pos).multiplyScalar(7.5).add(TARGET);
    camera.up.set(...view.up);
    controls.update();
  }
  renderer.setAnimationLoop(() => { animateSqueeze(); controls.update(); renderer.render(scene, camera); });
  document.body.dataset.ready = '1';
}
</script>
