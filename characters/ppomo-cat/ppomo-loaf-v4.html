  --ink: #6E3F27;         /* brown outline */
  --muted: #A27A63;
  --chip: rgba(255, 252, 247, 0.9);

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #2A2320; --ink: #F1D9C8; --muted: #C2A08C; --chip: rgba(50, 42, 38, 0.9); --line: #4A3E38; --accent: #EFA7B2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #2A2320; --ink: #F1D9C8; --muted: #C2A08C; --chip: rgba(50, 42, 38, 0.9); --line: #4A3E38; --accent: #EFA7B2; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-display); }
#stage { position: fixed; inset: 0; touch-action: none; }

.title { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); margin: 0; font-size: 26px; font-weight: 400; pointer-events: none; }

.bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; background: var(--chip); border: 1px solid var(--line); border-radius: 999px; max-width: calc(100% - 32px); }
.bar button { font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--accent); color: #fff; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- shape: ONE chubby loaf block (no separate head). The front face IS the face. ----------
// units: about 1 = body height. z points forward (face at +z), y up from the floor.
// side silhouette: flat bottom, broad rounded front, back line rising a little into a big round rump at the rear-top.
const SHAPE = {
  // metaballs: a round head in front, a bigger, taller body behind, two butt lobes at the very back
  head:  { x: 0, y: 0.42, z: 0.66, rx: 0.58, ry: 0.42, rz: 0.46 },
  body:  { x: 0, y: 0.50, z: -0.24, rx: 0.72, ry: 0.52, rz: 0.72 },
  rump:  { x: 0.29, y: 0.40, z: -0.80, rx: 0.41, ry: 0.40, rz: 0.40 },
  ear:   { x: 0.36, z: 0.66, rx: 0.15, ry: 0.15, rz: 0.10 },
  paw:   { x: 0.38, y: 0.06, z: 0.96, rx: 0.12, ry: 0.07, rz: 0.12 },        // front paws peeking out under the face
  foot:  { x: 0.55, y: 0.06, z: -0.95, rx: 0.12, ry: 0.07, rz: 0.12 },       // back feet at the rear corners
  eye:   { x: 0.26, y: 0.40, r: 0.045 },
  mouth: { y: 0.38 },
  blush: { x: 0.40, y: 0.31 },
};
const PAL = {
  body: '#F9CDD3',      // soft strawberry-milk pink
  shade: '#EFB0BB',     // slightly deeper pink on top of the rump
  belly: '#FBF0D4',     // cream belly band along the bottom
  cheek: '#F2A0AE',     // blush
  ink: '#5A3424',       // eyes
  line: '#A9643F',      // brown outline
};
const BLEND = { neck: 0.09, rump: 0.20, cleft: 0.05, ear: 0.07, limb: 0.08, floor: 0.06 };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const smax = (a, b, k) => -smin(-a, -b, k);
const ell = (x, y, z, c, rx, ry, rz) => (Math.hypot((x - c.x) / rx, (y - c.y) / ry, (z - c.z) / rz) - 1) * Math.min(rx, ry, rz);
// superellipsoid: squarer footprint from above (n > 2), round in profile
function mochi(x, y, z, L) {
  const u = Math.abs(x - L.x) / L.rx, w = Math.abs(z - L.z) / L.rz;
  const r = Math.pow(Math.pow(u, L.n) + Math.pow(w, L.n), 1 / L.n);
  const v = Math.abs(y - L.y) / L.ry, m = 2.4;                  // m > 2: blunter front and sides in profile
  return (Math.pow(Math.pow(r, m) + Math.pow(v, m), 1 / m) - 1) * Math.min(L.rx, L.ry, L.rz) * 0.9;
}
function bodySDF(x, y, z) {
  const S = SHAPE, R = S.rump;
  // a small blend between head and body keeps a soft crease at the neck, so the two read as separate parts
  let d = smin(ell(x, y, z, S.head, S.head.rx, S.head.ry, S.head.rz), ell(x, y, z, S.body, S.body.rx, S.body.ry, S.body.rz), BLEND.neck);
  const rump = smin(ell(x, y, z, { x: -R.x, y: R.y, z: R.z }, R.rx, R.ry, R.rz), ell(x, y, z, { x: R.x, y: R.y, z: R.z }, R.rx, R.ry, R.rz), BLEND.cleft);
  d = smin(d, rump, BLEND.rump);
  // a low, flat 'base' under everything so the belly line along the floor stays smooth (no dip under the neck)
  return smin(d, ell(x, y, z, { x: 0, y: 0.12, z: 0.0 }, 0.62, 0.14, 1.0), 0.12);
}
// height of the top surface at (x, z): where the ears sit
const topY = (x, z) => { let y = 2; while (y > 0 && bodySDF(x, y, z) > 0) y -= 0.004; return y; };
const EAR_Y = topY(SHAPE.ear.x, SHAPE.ear.z) + 0.04;
const cleft = (x, y, z) => Math.exp(-((x / 0.06) ** 2)) * smooth(-0.92, -1.12, z) * smooth(0.1, 0.25, y) * (1 - smooth(0.55, 0.72, y));
function modelSDF(x, y, z) {
  const S = SHAPE;
  let d = bodySDF(x, y, z);
  for (const s of [-1, 1]) {
    // ears: an ellipsoid that narrows toward the tip = a soft rounded triangle, tilted a little outward
    const E = S.ear, ex = x - s * E.x, ey = y - EAR_Y, ez = z - E.z;
    const c = Math.cos(s * 0.3), sn = Math.sin(s * 0.3);
    const lx = ex * c + ey * sn, ly = -ex * sn + ey * c;
    const taper = 1 - 0.45 * Math.max(-1, Math.min(1, ly / E.ry));
    d = smin(d, (Math.hypot(lx / (E.rx * taper), ly / E.ry, ez / E.rz) - 1) * Math.min(E.rx, E.ry, E.rz) * 0.8, BLEND.ear);
    d = smin(d, ell(x, y, z, { x: s * S.paw.x, y: S.paw.y, z: S.paw.z }, S.paw.rx, S.paw.ry, S.paw.rz), BLEND.limb);
    d = smin(d, ell(x, y, z, { x: s * S.foot.x, y: S.foot.y, z: S.foot.z }, S.foot.rx, S.foot.ry, S.foot.rz), BLEND.limb);
  }
  d += cleft(x, y, z) * 0.035;                    // a shallow groove down the back between the two lobes
  return smax(d, -(y - 0.02), BLEND.floor);       // flat underside: it lies on the floor
}
const BOUNDS = { min: [-0.95, -0.02, -1.3], max: [0.95, 1.2, 1.25] };

// ---------- surface (naive surface nets, projected onto the field) ----------
function meshField(f, min, max, h) {
  const nx = Math.ceil((max[0] - min[0]) / h), ny = Math.ceil((max[1] - min[1]) / h), nz = Math.ceil((max[2] - min[2]) / h);
  const sx = nx + 1, sxy = (nx + 1) * (ny + 1);
  const val = new Float32Array(sxy * (nz + 1));
  for (let k = 0; k <= nz; k++) for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++)
    val[i + sx * j + sxy * k] = f(min[0] + i * h, min[1] + j * h, min[2] + k * h);
  const cellV = new Int32Array(nx * ny * nz).fill(-1);
  const cellIdx = (i, j, k) => i + nx * (j + ny * k);
  const pos = [], EDGES = [], cv = new Float32Array(8);
  for (let a = 0; a < 8; a++) for (const bit of [1, 2, 4]) if (!(a & bit)) EDGES.push([a, a | bit]);
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    let mask = 0;
    for (let c = 0; c < 8; c++) { const v = val[(i + (c & 1)) + sx * (j + ((c >> 1) & 1)) + sxy * (k + ((c >> 2) & 1))]; cv[c] = v; if (v < 0) mask |= 1 << c; }
    if (mask === 0 || mask === 255) continue;
    let px = 0, py = 0, pz = 0, n = 0;
    for (const [a, b] of EDGES) {
      if ((cv[a] < 0) === (cv[b] < 0)) continue;
      const t = cv[a] / (cv[a] - cv[b]);
      px += (a & 1) + t * ((b & 1) - (a & 1)); py += ((a >> 1) & 1) + t * (((b >> 1) & 1) - ((a >> 1) & 1)); pz += ((a >> 2) & 1) + t * (((b >> 2) & 1) - ((a >> 2) & 1)); n++;
    }
    cellV[cellIdx(i, j, k)] = pos.length / 3;
    pos.push(min[0] + (i + px / n) * h, min[1] + (j + py / n) * h, min[2] + (k + pz / n) * h);
  }
  const idx = [], dims = [nx, ny, nz];
  for (let k = 0; k <= nz; k++) for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
    const g = [i, j, k], v0 = val[i + sx * j + sxy * k];
    for (let ax = 0; ax < 3; ax++) {
      const u = (ax + 1) % 3, w = (ax + 2) % 3;
      if (g[ax] >= dims[ax] || g[u] < 1 || g[w] < 1 || g[u] >= dims[u] || g[w] >= dims[w]) continue;
      const g2 = g.slice(); g2[ax]++;
      const v1 = val[g2[0] + sx * g2[1] + sxy * g2[2]];
      if ((v0 < 0) === (v1 < 0)) continue;
      const cell = (du, dw) => { const c = g.slice(); c[u] -= du; c[w] -= dw; return cellV[cellIdx(c[0], c[1], c[2])]; };
      const a = cell(1, 1), b = cell(0, 1), c = cell(0, 0), d = cell(1, 0);
      if (a < 0 || b < 0 || c < 0 || d < 0) continue;
      if (v0 < 0) idx.push(a, b, c, a, c, d); else idx.push(a, c, b, a, d, c);
    }
  }
  const e = h * 0.25;
  for (let q = 0; q < pos.length; q += 3) {
    let x = pos[q], y = pos[q + 1], z = pos[q + 2];
    for (let it = 0; it < 3; it++) {
      const d = f(x, y, z);
      let gx = f(x + e, y, z) - f(x - e, y, z), gy = f(x, y + e, z) - f(x, y - e, z), gz = f(x, y, z + e) - f(x, y, z - e);
      const gl = Math.hypot(gx, gy, gz) || 1; x -= d * gx / gl; y -= d * gy / gl; z -= d * gz / gl;
    }
    pos[q] = x; pos[q + 1] = y; pos[q + 2] = z;
  }
  // outward winding: the first triangle's normal should point away from the inside
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const A = new THREE.Vector3().fromArray(pos, idx[0] * 3), B = new THREE.Vector3().fromArray(pos, idx[1] * 3), C = new THREE.Vector3().fromArray(pos, idx[2] * 3);
  const fn = B.clone().sub(A).cross(C.clone().sub(A)), mid = A.clone().add(B).add(C).divideScalar(3);
  const out = new THREE.Vector3(f(mid.x + e, mid.y, mid.z) - f(mid.x - e, mid.y, mid.z), f(mid.x, mid.y + e, mid.z) - f(mid.x, mid.y - e, mid.z), f(mid.x, mid.y, mid.z + e) - f(mid.x, mid.y, mid.z - e));
  if (fn.dot(out) < 0) for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
  geo.setIndex(idx);
  return geo;
}

// ---------- colour: pink body, cream belly band, blush cheeks, a touch deeper pink on the butt top ----------
function colorize(geo) {
  const lineC = new THREE.Color(PAL.line), body = new THREE.Color(PAL.body), shade = new THREE.Color(PAL.shade), belly = new THREE.Color(PAL.belly), cheek = new THREE.Color(PAL.cheek);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    c.copy(body);
    c.lerp(shade, 0.25 * smooth(0.6, 0.95, y) * smooth(-0.1, -0.6, z));       // back a little deeper
    let band = 1 - smooth(0.15, 0.24, y - 0.04 * Math.cos(z * 1.6));         // cream belly along the bottom
    for (const sx of [-1, 1]) {                                              // paws and feet stay pink
      const dp = Math.hypot((x - sx * SHAPE.paw.x) / 0.26, (y - SHAPE.paw.y) / 0.2, (z - SHAPE.paw.z) / 0.28);
      const df = Math.hypot((x - sx * SHAPE.foot.x) / 0.24, (y - SHAPE.foot.y) / 0.2, (z - SHAPE.foot.z) / 0.26);
      band *= smooth(0.8, 1.15, Math.min(dp, df));
    }
    c.lerp(belly, band * 0.95);
    c.lerp(shade, 0.8 * smooth(0.2, 0.8, cleft(x, y, z)));                 // the cleft reads as a soft brown line
    for (const s of [-1, 1]) {                                               // blush below the eyes
      const dd = Math.hypot(x - s * SHAPE.blush.x, (y - SHAPE.blush.y) * 1.3, Math.max(0, 0.85 - z) * 1.5);
      c.lerp(cheek, 0.85 * (1 - smooth(0.05, 0.2, dd)));
    }
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

// ---------- scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xfbeee6, 2.6));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff6ee, 0.75);
sun.position.set(-1.5, 5, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 16; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.002;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 14 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ color: 0x8a5a40, opacity: 0.14 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const geo = meshField(modelSDF, BOUNDS.min, BOUNDS.max, 0.02);
geo.computeVertexNormals();
colorize(geo);
const skin = new THREE.MeshLambertMaterial({ vertexColors: true });   // soft, matte, like the pastel drawings
const body = new THREE.Mesh(geo, skin);
body.castShadow = true; body.receiveShadow = false;
scene.add(body);

// brown outline: the same mesh pushed out along its normals, drawn from the back
const lineGeo = geo.clone();
{
  const p = lineGeo.attributes.position, n = lineGeo.attributes.normal;
  for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + n.getX(i) * 0.018, p.getY(i) + n.getY(i) * 0.018, p.getZ(i) + n.getZ(i) * 0.018);
}
const outline = new THREE.Mesh(lineGeo, new THREE.MeshBasicMaterial({ color: PAL.line, side: THREE.BackSide }));
scene.add(outline);

// face: dot eyes and a little ω mouth on the front surface
const frontZ = (x, y) => { let z = 3; while (z > -3 && modelSDF(x, y, z) > 0) z -= 0.003; return z; };
const inkMat = new THREE.MeshBasicMaterial({ color: PAL.ink });
for (const s of [-1, 1]) {
  const x = s * SHAPE.eye.x, y = SHAPE.eye.y, z = frontZ(x, y);
  const e = new THREE.Mesh(new THREE.SphereGeometry(SHAPE.eye.r, 24, 16), inkMat);
  e.position.set(x, y, z - 0.012); e.scale.set(1, 1.08, 0.45); e.lookAt(x * 4, y, z + 4);
  scene.add(e);
}
{
  const g = new THREE.Group();
  for (const s of [-1, 1]) {
    const a = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.008, 8, 24, Math.PI), new THREE.MeshBasicMaterial({ color: PAL.line }));
    a.rotation.z = Math.PI; a.position.x = s * 0.03; g.add(a);
  }
  const y = SHAPE.mouth.y; g.position.set(0, y, frontZ(0, y) + 0.004); scene.add(g);
}

// ---------- camera & views ----------
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 80);
const TARGET = new THREE.Vector3(0, 0.38, 0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 4; controls.maxDistance = 14; controls.maxPolarAngle = Math.PI * 0.53;
const VIEWS = {
  three: [4.6, 2.4, 4.4], front: [0, 0.75, 6.6], side: [6.6, 0.8, 0], back: [0, 0.95, -6.6], top: [0.001, 7.0, 0.4], rear: [-4.2, 2.8, -4.4],
};
let tween = null;
function goView(name) {
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  if (name === 'spin') { controls.autoRotate = true; controls.autoRotateSpeed = 2.2; return; }
  controls.autoRotate = false;
  tween = { from: camera.position.clone(), to: new THREE.Vector3(...VIEWS[name]), t: 0 };
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => goView(b.dataset.view)));
camera.position.set(...VIEWS.three);
controls.update();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.fov = w < h ? 40 : 26;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const params = new URLSearchParams(location.search);
if (params.get('view') && VIEWS[params.get('view')]) camera.position.set(...VIEWS[params.get('view')]);
renderer.setAnimationLoop(() => {
  if (tween) {
    tween.t = Math.min(1, tween.t + 0.05);
    const e = tween.t * tween.t * (3 - 2 * tween.t);
    camera.position.lerpVectors(tween.from, tween.to, e);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
document.body.dataset.ready = '1';
</script>
