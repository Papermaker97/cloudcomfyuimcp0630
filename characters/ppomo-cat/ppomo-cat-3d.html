<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ppomo Cat 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
  /* Layout: full-bleed stage, character centered; one quiet control strip at the bottom. */
  :root {
    --bg-top: #F3F4F7;
    --bg-bottom: #E1E4EA;
    --fg: #3A3A3E;
    --muted: #7C808A;
    --chip: rgba(255, 255, 255, 0.72);
    --chip-line: rgba(58, 58, 62, 0.10);
    --chip-on: #3A3A3E;
    --chip-on-fg: #F7F5F0;
    --font-display: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-top: #2A2D34; --bg-bottom: #1B1D22; --fg: #ECEDF0; --muted: #9A9EA8;
      --chip: rgba(40, 42, 49, 0.72); --chip-line: rgba(236, 237, 240, 0.12);
      --chip-on: #ECEDF0; --chip-on-fg: #24262C; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #2A2D34; --bg-bottom: #1B1D22; --fg: #ECEDF0; --muted: #9A9EA8;
    --chip: rgba(40, 42, 49, 0.72); --chip-line: rgba(236, 237, 240, 0.12);
    --chip-on: #ECEDF0; --chip-on-fg: #24262C; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--fg); font-family: var(--font-ui);
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  header {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px;
    display: flex; align-items: baseline; gap: 10px; pointer-events: none;
  }
  header h1 { margin: 0; font: 400 1.35rem/1.2 var(--font-display); letter-spacing: 0.01em; }
  header span { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
    max-width: calc(100% - 32px); padding: 6px; border-radius: 999px;
    background: var(--chip); border: 1px solid var(--chip-line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .controls button {
    font: 500 0.8rem/1 var(--font-ui); color: var(--fg); background: transparent;
    border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .controls button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
  .controls button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--chip-line); }
  .sep { width: 1px; height: 18px; background: var(--chip-line); }
  #sheet-labels { position: fixed; inset: 0; pointer-events: none; display: none; }
  #sheet-labels div { position: absolute; font: 600 13px/1 var(--font-ui); color: var(--muted); letter-spacing: 0.06em; }
</style>

<div id="stage"></div>
<header>
  <h1>뽀모 · 고양이</h1>
  <span>드래그해서 돌려보기 · 휠로 확대</span>
</header>
<div class="controls" role="toolbar" aria-label="보기 설정">
  <button id="btn-rotate" type="button" aria-pressed="true">자동 회전</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="color-gray" type="button" data-color="#B9BDC7" aria-pressed="true"><span class="swatch" style="background:#B9BDC7"></span>그레이</button>
  <button id="color-cream" type="button" data-color="#E4DACB" aria-pressed="false"><span class="swatch" style="background:#E4DACB"></span>크림</button>
  <button id="color-charcoal" type="button" data-color="#80869A" aria-pressed="false"><span class="swatch" style="background:#80869A"></span>차콜</button>
</div>
<div id="sheet-labels"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- shape table (lying loaf cat, units ≈ head radius 0.6, y up from the floor, z = forward) ----------
const SHAPE = {
  head:  { x: 0, y: 0.60, z: 0.68, r: 0.62, sx: 1.06, sy: 0.92 },      // 머리 (몸 앞쪽에 붙음)
  torso: { x: 0, y: 0.64, z: -0.28, rx: 0.86, ry: 0.66, rz: 0.82 },   // 몸통 (길게 누운 로프형)
  rump:  { x: 0, y: 0.78, z: -0.82, r: 0.72 },                        // 엉덩이 쪽 볼륨 (등이 뒤로 갈수록 높게)
  cheek: { x: 0.39, y: 0.45, z: 1.05, r: 0.31 },                      // 볼주머니 ±x
  ear:   { x: 0.35, y: 1.03, z: 0.60, tilt: 20 },                     // 귀 ±x, 바깥으로 기울기(°)
  eye:   { x: 0.13, y: 0.68, r: 0.038 },                              // 점 눈 ±x (z = 얼굴 표면)
  mouth: { y: 0.57 },
  belly: { x: 0, y: 0.26, rx: 0.27, ry: 0.25 },                       // 가슴 크림 패치 (z = 표면)
  paw:   { x: 0.30, y: 0.13, z0: 0.72, z1: 1.30, r: 0.14 },           // 앞발: 앞으로 뻗은 캡슐 ±x
  foot:  { x: 0.66, y: 0.11, z: -0.92, r: 0.15 },                     // 뒷발: 옆 뒤쪽 작은 nub ±x
  butt:  { x: 0.31, y: 0.56, z: -1.27, r: 0.41 },                     // 엉덩이 두 볼 ±x
};
const PAL = {
  body: '#B9BDC7',      // light neutral gray
  cheek: '#F4B3C2',     // soft pink — core of the cheek-pouch bloom
  belly: '#F6E8D2',     // warm cream
  butt: '#F6B9A3',      // soft peach/coral — core of the butt bloom
  earInner: '#F6C6CF',
  ink: '#3A3A3E',
};
const GROUND_Y = 0;
const CENTER = new THREE.Vector3(0, 0.6, -0.15);

// ---------- body = smooth union of head + torso + rump, flat bottom ----------
const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
const smax = (a, b, k) => -smin(-a, -b, k);
function sdEllipsoid(p, c, rx, ry, rz) {
  const k0 = Math.hypot((p.x - c.x) / rx, (p.y - c.y) / ry, (p.z - c.z) / rz);
  return (k0 - 1) * Math.min(rx, ry, rz);
}
function bodySDF(p) {
  const H = SHAPE.head, T = SHAPE.torso, Rm = SHAPE.rump;
  const head = sdEllipsoid(p, H, H.r * H.sx, H.r * H.sy, H.r);
  const torso = sdEllipsoid(p, T, T.rx, T.ry, T.rz);
  const rump = sdEllipsoid(p, Rm, Rm.r, Rm.r, Rm.r);
  const d = smin(head, smin(torso, rump, 0.35), 0.2);
  return smax(d, -(p.y - 0.035), 0.12);                      // 바닥은 납작하게
}

function buildBodyGeometry() {
  const geo = new THREE.SphereGeometry(1, 200, 140);
  const pos = geo.attributes.position;
  const o = CENTER.clone(), d = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    let t = 2.6;
    while (t > 0 && bodySDF(p.copy(d).multiplyScalar(t).add(o)) > 0) t -= 0.02;
    let lo = t, hi = t + 0.02;
    for (let k = 0; k < 24; k++) {
      const m = (lo + hi) / 2;
      if (bodySDF(p.copy(d).multiplyScalar(m).add(o)) > 0) hi = m; else lo = m;
    }
    p.copy(d).multiplyScalar(lo).add(o);
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  geo.computeVertexNormals();
  return geo;
}
// front surface z of the body at (x, y)
function bodyFrontZ(x, y) {
  const p = new THREE.Vector3();
  let z = 3; while (z > -3 && bodySDF(p.set(x, y, z)) > 0) z -= 0.004;
  return z;
}

// ---------- scene ----------
const params = new URLSearchParams(location.search);
const SHEET = params.has('sheet');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: SHEET });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.35;

scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe1e7, 0.8));
const sun = new THREE.DirectionalLight(0xfffaf5, 1.05);
sun.position.set(-1.6, 5, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 14;
sun.shadow.blurSamples = 20;
sun.shadow.bias = -0.002;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 14 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.14 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = GROUND_Y;
ground.receiveShadow = true;
scene.add(ground);

// ---------- materials (matte silicone squishy) ----------
const silicone = (extra = {}) => new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.6, clearcoat: 0.2, clearcoatRoughness: 0.55,
  sheen: 0.35, sheenRoughness: 0.8, sheenColor: new THREE.Color(0xffffff), ...extra,
});
// every fur part shares one material; its colour comes from per-vertex pastel blooms (see recolor)
const furMat = silicone({ vertexColors: true });
const innerEarMat = silicone({ color: PAL.earInner, roughness: 0.65 });
const inkMat = new THREE.MeshPhysicalMaterial({ color: PAL.ink, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.3 });

// ---------- pastel bloom colour field ----------
// Colour is a function of position in the model's rest pose, so a pouch and the body beside it
// get the same colour where they meet: the bloom fades across the seam with no hard edge.
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const BLOOMS = [];
function addBloom(color, center, outward, r, inner = 0.55, outer = 1.55, push = 0.35) {
  const emitter = center.clone().addScaledVector(outward.clone().normalize(), r * push);
  BLOOMS.push({ color: new THREE.Color(color), emitter, r, inner, outer });
}
const BELLY_FIELD = { color: new THREE.Color(PAL.belly) };
function colorAt(p, base, out) {
  out.copy(base);
  for (const b of BLOOMS) {
    const w = 1 - smooth(b.inner * b.r, b.outer * b.r, p.distanceTo(b.emitter));
    if (w > 0) out.lerp(b.color, w);
  }
  if (BELLY_FIELD.center) {                       // elliptical chest patch with a soft rim
    const f = BELLY_FIELD, dx = (p.x - f.center.x) / f.rx, dy = (p.y - f.center.y) / f.ry;
    const front = smooth(f.zMin, f.zMin + 0.1, p.z);
    const w = (1 - smooth(0.62, 1.1, Math.hypot(dx, dy))) * front;
    if (w > 0) out.lerp(f.color, w);
  }
  return out;
}
const COLORED = [];   // meshes whose vertex colours follow the field
function recolor(baseHex) {
  const base = new THREE.Color(baseHex), c = new THREE.Color(), p = new THREE.Vector3();
  for (const m of COLORED) {
    const rest = m.userData.restPos, col = m.geometry.attributes.color;
    for (let i = 0; i < col.count; i++) {
      colorAt(p.fromArray(rest, i * 3), base, c);
      col.setXYZ(i, c.r, c.g, c.b);
    }
    col.needsUpdate = true;
  }
}
function bakeRestPositions() {
  ppomo.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  for (const m of COLORED) {
    const pos = m.geometry.attributes.position, rest = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld).toArray(rest, i * 3);
    m.userData.restPos = rest;
    m.geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
  }
}

// ---------- helpers ----------
const SPHERE_GEO = new THREE.SphereGeometry(1, 64, 48);
function mesh(geo, mat) {
  const colored = mat === furMat;                  // gradient parts need their own colour buffer
  const m = new THREE.Mesh(colored ? geo.clone() : geo, mat);
  if (colored) COLORED.push(m);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function ball(mat, r, sx = 1, sy = 1, sz = 1) {
  const m = mesh(SPHERE_GEO, mat);
  m.scale.set(r * sx, r * sy, r * sz);
  return m;
}
// a Group placed at the part's centre, so scale() grows the part around itself (빵빵폼)
function part(name, x, y, z) { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); return g; }
// soft cat ear: a rounded triangle turned on a lathe, flattened front-to-back
function earGeometry(scale = 1) {
  const pts = [[0, -0.06], [0.2, -0.06], [0.215, 0.02], [0.19, 0.12], [0.13, 0.22], [0.07, 0.29], [0.03, 0.315], [0, 0.32]]
    .map(([r, y]) => new THREE.Vector2(r * scale, y * scale));
  return new THREE.LatheGeometry(pts, 48);
}

// ---------- build ----------
const ppomo = new THREE.Group(); ppomo.name = 'ppomo';
scene.add(ppomo);

const body = new THREE.Group(); body.name = 'body';
const bodyMesh = new THREE.Mesh(buildBodyGeometry(), furMat);
bodyMesh.castShadow = true; bodyMesh.receiveShadow = true;
COLORED.push(bodyMesh);
body.add(bodyMesh);
ppomo.add(body);

const H = SHAPE.head, headC = new THREE.Vector3(H.x, H.y, H.z);

// cheek pouches — big round puffs flanking the face, pink bloom from the front of each
for (const side of [-1, 1]) {
  const s = SHAPE.cheek, c = new THREE.Vector3(s.x * side, s.y, s.z);
  const g = part(side < 0 ? 'cheekL' : 'cheekR', c.x, c.y, c.z);
  g.add(ball(furMat, s.r));
  ppomo.add(g);
  const out = c.clone().sub(headC).normalize().add(new THREE.Vector3(0, 0, 1.2));
  addBloom(PAL.cheek, c, out, s.r);
}

// ears — soft rounded triangles on top of the head, tilted outward
for (const side of [-1, 1]) {
  const s = SHAPE.ear;
  const g = part(side < 0 ? 'earL' : 'earR', s.x * side, s.y, s.z);
  const outer = mesh(earGeometry(1.12), furMat);
  outer.scale.set(1, 1, 0.72);
  g.add(outer);
  const inner = mesh(earGeometry(0.65), innerEarMat);
  inner.scale.set(1, 1, 0.3);
  inner.position.set(0, 0.03, 0.15);
  inner.castShadow = false;
  g.add(inner);
  g.rotation.z = -THREE.MathUtils.degToRad(s.tilt) * side;
  g.rotation.x = 0.12;
  ppomo.add(g);
}

// eyes — tiny dots set high between the cheeks
for (const side of [-1, 1]) {
  const s = SHAPE.eye, x = s.x * side, z = bodyFrontZ(x, s.y);
  const g = part(side < 0 ? 'eyeL' : 'eyeR', x, s.y, z - 0.008);
  const e = ball(inkMat, s.r, 1, 1.1, 0.5); e.castShadow = false;
  g.add(e);
  g.lookAt(new THREE.Vector3(x * 3, s.y, z + 3));
  ppomo.add(g);
}

// mouth — tiny ω between the cheeks
{
  const y = SHAPE.mouth.y;
  const g = new THREE.Group(); g.name = 'mouth';
  g.position.set(0, y, bodyFrontZ(0, y) + 0.003);
  for (const side of [-1, 1]) {
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.006, 8, 24, Math.PI), inkMat);
    arc.rotation.z = Math.PI;               // lower half arc
    arc.position.x = side * 0.024;
    g.add(arc);
  }
  ppomo.add(g);
}

// chest patch (belly) — cream, soft rim, sits between and under the cheeks
{
  const s = SHAPE.belly, z = bodyFrontZ(s.x, s.y);
  const g = part('belly', s.x, s.y, z - 0.06);
  g.add(ball(furMat, 1, s.rx, s.ry, 0.12));
  g.rotation.x = -0.25;
  Object.assign(BELLY_FIELD, { center: new THREE.Vector3(s.x, s.y, z), rx: s.rx, ry: s.ry, zMin: z - 0.35 });
  ppomo.add(g);
}

// front paws — stubby capsules stretched forward along the floor
for (const side of [-1, 1]) {
  const s = SHAPE.paw, len = s.z1 - s.z0;
  const g = part(side < 0 ? 'armL' : 'armR', s.x * side, s.y, (s.z0 + s.z1) / 2);
  const m = mesh(new THREE.CapsuleGeometry(s.r, len, 12, 32), furMat);
  m.rotation.x = Math.PI / 2;
  m.scale.set(1.05, 1, 0.9);
  g.add(m);
  ppomo.add(g);
}

// back feet — small nubs at the rear sides
for (const side of [-1, 1]) {
  const s = SHAPE.foot;
  const g = part(side < 0 ? 'footL' : 'footR', s.x * side, s.y, s.z);
  g.add(ball(furMat, s.r, 1, 0.8, 1.35));
  ppomo.add(g);
}

// butt — two round cheeks at the back, peach bloom from each
{
  const s = SHAPE.butt;
  const g = part('butt', 0, s.y, s.z);
  for (const side of [-1, 1]) {
    const b = ball(furMat, s.r);
    b.position.set(s.x * side, 0, 0);
    g.add(b);
    addBloom(PAL.butt, new THREE.Vector3(s.x * side, s.y, s.z), new THREE.Vector3(side * 0.5, -0.1, -1), s.r, 0.5, 1.5, 0.4);
  }
  ppomo.add(g);
}

bakeRestPositions();
recolor(PAL.body);

// ---------- camera & controls ----------
const camera = new THREE.PerspectiveCamera(30, stage.clientWidth / stage.clientHeight, 0.1, 60);
const TARGET = new THREE.Vector3(0, 0.55, -0.1);
camera.position.set(4.6, 2.3, 4.6);       // 3/4 view, face to the left like the references
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = !SHEET && !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 1.4;
controls.update();

// ---------- UI ----------
const rotateBtn = document.getElementById('btn-rotate');
rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
rotateBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  rotateBtn.setAttribute('aria-pressed', String(controls.autoRotate));
});
const colorBtns = document.querySelectorAll('[data-color]');
colorBtns.forEach((b) => b.addEventListener('click', () => {
  recolor(b.dataset.color);
  colorBtns.forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
}));

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ---------- 4-view sheet (?sheet) ----------
const VIEWS = [
  { label: 'FRONT · 정면', pos: [0, 0, 1], up: [0, 1, 0] },
  { label: 'SIDE · 측면', pos: [-1, 0, 0], up: [0, 1, 0] },   // 오른쪽 옆모습, 얼굴이 화면 오른쪽
  { label: 'BACK · 후면', pos: [0, 0, -1], up: [0, 1, 0] },
  { label: 'TOP · 윗면', pos: [0, 1, 0], up: [0, 0, -1] },    // 얼굴(앞)이 화면 아래
];
function renderSheet() {
  document.querySelector('header').hidden = true;
  document.querySelector('.controls').hidden = true;
  const labels = document.getElementById('sheet-labels');
  labels.style.display = 'block';
  const W = stage.clientWidth, H = stage.clientHeight, w = W / 2, h = H / 2;
  const cam = new THREE.OrthographicCamera(-1.95, 1.95, 1.95, -1.95, 0.1, 60);
  renderer.setScissorTest(true);
  VIEWS.forEach((v, i) => {
    const x = (i % 2) * w, yTop = Math.floor(i / 2) * h;
    renderer.setViewport(x, H - yTop - h, w, h);
    renderer.setScissor(x, H - yTop - h, w, h);
    cam.position.set(...v.pos).multiplyScalar(8).add(TARGET);
    cam.up.set(...v.up);
    cam.lookAt(TARGET);
    ground.visible = i !== 3;   // top view: no floor shadow
    renderer.render(scene, cam);
    const el = document.createElement('div');
    el.textContent = v.label; el.style.left = `${x + 18}px`; el.style.top = `${yTop + 16}px`;
    labels.appendChild(el);
  });
  document.body.dataset.ready = '1';
}

if (SHEET) {
  ground.material.opacity = 0.1;
  renderSheet();
} else {
  const view = VIEWS.find((v) => v.label.toLowerCase().startsWith(params.get('view') || '~'));
  if (view) {
    camera.position.set(...view.pos).multiplyScalar(7.5).add(TARGET);
    camera.up.set(...view.up);
    controls.update();
  }
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
  document.body.dataset.ready = '1';
}
</script>
