<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1000" height="760" fill="#FBFAF8"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#2E2B2A">Lab 1 wiring — Nano 33 IoT + FSR + potentiometer + button</text>
  <text x="30" y="64" fill="#7A746F">Find each pin by the label printed on the Nano. "+ rail" and "− rail" are the long side strips of the breadboard.</text>

  <!-- step 0: power rails -->
  <rect x="30" y="85" width="940" height="80" rx="10" fill="#fff" stroke="#E4DFD9"/>
  <text x="50" y="110" font-weight="700">Step 0 — power the rails (2 wires)   ⚠ use 3V3, not 5V / VUSB</text>
  <text x="50" y="134">• Nano <tspan font-family="Menlo, monospace" font-weight="700">3V3</tspan> pin → <tspan fill="#D9534F" font-weight="700">red + rail</tspan></text>
  <text x="50" y="156">• Nano <tspan font-family="Menlo, monospace" font-weight="700">GND</tspan> pin → <tspan fill="#3B6FB6" font-weight="700">blue − rail</tspan></text>

  <!-- Nano -->
  <rect x="40" y="180" width="190" height="560" rx="12" fill="#2F6E8F"/>
  <text x="135" y="215" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Nano 33 IoT</text>
  <g fill="#fff" font-family="Menlo, monospace" font-size="17" font-weight="700">
    <text x="220" y="305" text-anchor="end">A0</text>
    <text x="220" y="485" text-anchor="end">A1</text>
    <text x="220" y="665" text-anchor="end">D2</text>
  </g>
  <g fill="#F2C94C"><circle cx="230" cy="300" r="7"/><circle cx="230" cy="480" r="7"/><circle cx="230" cy="660" r="7"/></g>

  <!-- helper: rail tags -->
  <!-- Row 1: FSR on A0 -->
  <text x="270" y="250" font-size="16" font-weight="700" fill="#8A6A3B">① FSR → A0</text>
  <rect x="560" y="196" width="88" height="26" rx="13" fill="#FBE3E2" stroke="#D9534F"/><text x="604" y="214" text-anchor="middle" font-size="13" fill="#D9534F" font-weight="700">+ rail</text>
  <path d="M604 222 V240" stroke="#D9534F" stroke-width="3"/>
  <ellipse cx="604" cy="260" rx="34" ry="20" fill="#E8C9A0" stroke="#8A6A3B" stroke-width="2"/><text x="604" y="265" text-anchor="middle" font-size="13" font-weight="700">FSR</text>
  <path d="M604 280 V300" stroke="#2E2B2A" stroke-width="3"/>
  <circle cx="604" cy="300" r="6" fill="#2E2B2A"/>
  <path d="M230 300 H604" stroke="#F2C94C" stroke-width="4"/>
  <path d="M604 300 V316" stroke="#2E2B2A" stroke-width="3"/>
  <rect x="592" y="316" width="24" height="40" fill="#fff" stroke="#2E2B2A" stroke-width="2"/>
  <path d="M604 356 V372" stroke="#3B6FB6" stroke-width="3"/>
  <rect x="560" y="372" width="88" height="26" rx="13" fill="#E1EAF6" stroke="#3B6FB6"/><text x="604" y="390" text-anchor="middle" font-size="13" fill="#3B6FB6" font-weight="700">− rail</text>
  <text x="660" y="262" font-size="13">FSR: 2 legs, either way round</text>
  <text x="630" y="335" font-size="13">10kΩ (brown-black-orange)</text>
  <text x="630" y="352" font-size="12" fill="#7A746F">the A0 wire joins between FSR and 10kΩ</text>

  <!-- Row 2: pot on A1 -->
  <text x="270" y="430" font-size="16" font-weight="700" fill="#5B6B8C">② potentiometer → A1</text>
  <rect x="440" y="455" width="88" height="26" rx="13" fill="#FBE3E2" stroke="#D9534F"/><text x="484" y="473" text-anchor="middle" font-size="13" fill="#D9534F" font-weight="700">+ rail</text>
  <path d="M528 468 H560" stroke="#D9534F" stroke-width="3"/>
  <rect x="560" y="445" width="150" height="70" rx="10" fill="#DDE3EA" stroke="#5B6B8C" stroke-width="2"/>
  <text x="635" y="472" text-anchor="middle" font-size="13" font-weight="700">potentiometer</text>
  <text x="635" y="490" text-anchor="middle" font-size="12" fill="#5B6B8C">outer · middle · outer</text>
  <path d="M710 468 H742" stroke="#3B6FB6" stroke-width="3"/>
  <rect x="742" y="455" width="88" height="26" rx="13" fill="#E1EAF6" stroke="#3B6FB6"/><text x="786" y="473" text-anchor="middle" font-size="13" fill="#3B6FB6" font-weight="700">− rail</text>
  <path d="M635 515 V535 H400 V480 H230" fill="none" stroke="#F2C94C" stroke-width="4"/>
  <text x="420" y="553" font-size="13">middle leg → A1</text>

  <!-- Row 3: button on D2 -->
  <text x="270" y="610" font-size="16" font-weight="700" fill="#2E2B2A">③ button → D2</text>
  <rect x="560" y="556" width="88" height="26" rx="13" fill="#FBE3E2" stroke="#D9534F"/><text x="604" y="574" text-anchor="middle" font-size="13" fill="#D9534F" font-weight="700">+ rail</text>
  <path d="M604 582 V604" stroke="#D9534F" stroke-width="3"/>
  <rect x="584" y="604" width="40" height="36" rx="5" fill="#fff" stroke="#2E2B2A" stroke-width="2"/><circle cx="604" cy="622" r="10" fill="#2E2B2A"/>
  <path d="M604 640 V660" stroke="#2E2B2A" stroke-width="3"/>
  <circle cx="604" cy="660" r="6" fill="#2E2B2A"/>
  <path d="M230 660 H604" stroke="#F2C94C" stroke-width="4"/>
  <path d="M604 660 V676" stroke="#2E2B2A" stroke-width="3"/>
  <rect x="592" y="676" width="24" height="40" fill="#fff" stroke="#2E2B2A" stroke-width="2"/>
  <path d="M604 716 V722" stroke="#3B6FB6" stroke-width="3"/>
  <rect x="560" y="722" width="88" height="26" rx="13" fill="#E1EAF6" stroke="#3B6FB6"/><text x="604" y="740" text-anchor="middle" font-size="13" fill="#3B6FB6" font-weight="700">− rail</text>
  <text x="640" y="626" font-size="13">button: use two DIAGONAL legs</text>
  <text x="640" y="700" font-size="13">10kΩ (brown-black-orange)</text>
  <text x="640" y="717" font-size="12" fill="#7A746F">the D2 wire joins between button and 10kΩ</text>
</svg>
